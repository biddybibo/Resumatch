<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#08080f"/>
  <title>RESUMATCH — Sign In</title>
  <link rel="icon" type="image/jpeg" href="/logo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#08080f; --surface:#0f0f1a; --border:#1e1e30; --border-light:#2a2a3e; --text:#e0e0f0; --muted:#9999aa; --accent:#00e5a0; --danger:#ff6b6b; }
    body { background:var(--bg); color:var(--text); font-family:'DM Mono',monospace; min-height:100vh; display:flex; flex-direction:column; }
    body::before { content:''; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E"); pointer-events:none; z-index:0; }
    nav { position:sticky; top:0; z-index:100; border-bottom:1px solid var(--border); background:rgba(8,8,15,0.85); backdrop-filter:blur(16px); padding:0 32px; height:56px; display:flex; align-items:center; gap:16px; }
    .nav-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent); }
    .nav-logo { font-family:'Syne',sans-serif; font-weight:900; font-size:17px; letter-spacing:3px; color:#fff; text-decoration:none; }
    .main { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 24px; position:relative; z-index:1; }
    .auth-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:40px 36px; width:100%; max-width:400px; }
    .auth-title { font-family:'Syne',sans-serif; font-weight:900; font-size:24px; letter-spacing:-0.5px; margin-bottom:8px; }
    .auth-sub { color:var(--muted); font-size:12px; margin-bottom:28px; }
    .google-btn { width:100%; display:flex; align-items:center; justify-content:center; gap:10px; background:rgba(255,255,255,0.05); border:1px solid var(--border-light); color:var(--text); font-family:'DM Mono',monospace; font-size:12px; letter-spacing:0.5px; padding:12px; border-radius:8px; cursor:pointer; transition:all 0.2s; margin-bottom:24px; }
    .google-btn:hover { border-color:var(--accent); background:rgba(0,229,160,0.05); }
    .google-btn svg { width:18px; height:18px; }
    .divider { display:flex; align-items:center; gap:12px; margin-bottom:24px; color:var(--muted); font-size:10px; letter-spacing:2px; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:10px; letter-spacing:2px; color:var(--muted); margin-bottom:8px; }
    .field input { width:100%; background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:8px; color:#e8e8f0; padding:12px 14px; font-size:13px; font-family:'DM Mono',monospace; transition:border-color 0.2s; }
    .field input:focus { outline:none; border-color:var(--accent); }
    .field input::placeholder { color:#555; }
    .error-msg { color:var(--danger); font-size:11px; margin-bottom:16px; display:none; }
    .success-msg { color:var(--accent); font-size:11px; margin-bottom:16px; display:none; }
    .submit-btn { width:100%; background:var(--accent); color:#08080f; border:none; border-radius:10px; padding:13px; font-family:'Syne',sans-serif; font-weight:800; font-size:13px; letter-spacing:1.5px; cursor:pointer; transition:transform 0.15s,box-shadow 0.15s; margin-top:8px; }
    .submit-btn:hover { transform:scale(1.02); box-shadow:0 0 40px rgba(0,229,160,0.2); }
    .submit-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }
    .toggle { text-align:center; margin-top:20px; font-size:12px; color:var(--muted); }
    .toggle a { color:var(--accent); cursor:pointer; text-decoration:none; }
    .toggle a:hover { text-decoration:underline; }
    @media(max-width:700px){
      nav { padding:0 16px; }
      .auth-card { padding:28px 20px; }
    }
      nav { padding-top: env(safe-area-inset-top) !important; height: calc(56px + env(safe-area-inset-top)) !important; }
    @media (max-width: 700px) { nav { position: relative !important; } }
  </style>
</head>
<body>
<nav>
  <img src="/logo.jpg" alt="Resumatch" style="width:32px;height:32px;border-radius:6px;object-fit:cover;">
  <a href="/" class="nav-logo">RESUMATCH</a>
</nav>
<div class="main">
  <div class="auth-card">
    <div class="auth-title" id="auth-title">Sign in</div>
    <div class="auth-sub" id="auth-sub">Welcome back. Sign in to tailor your resume.</div>
    <button class="google-btn" onclick="googleSignIn()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
    <div class="divider">OR</div>
    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg"></div>
    <form onsubmit="handleSubmit(event)">
      <div class="field">
        <label>EMAIL</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label>PASSWORD</label>
        <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">SIGN IN</button>
    </form>
    <div class="toggle" id="toggle">
      Don't have an account? <a onclick="toggleMode()">Sign up</a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://owqkwpiytuwcxpqlmktc.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93cWt3cGl5dHV3Y3hwcWxta3RjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MTk0MDksImV4cCI6MjA5MTE5NTQwOX0.u0W75OV7LrgT3XWVlM55mfuvGX_zCujxtholxNtYikM';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let isSignUp = false;
  let redirecting = false;

  // Handle OAuth callback and existing sessions
  sb.auth.onAuthStateChange((event, session) => {
    if (session && !redirecting) {
      redirecting = true;
      window.location.replace('/app');
    }
  });

  function toggleMode() {
    isSignUp = !isSignUp;
    document.getElementById('auth-title').textContent = isSignUp ? 'Create account' : 'Sign in';
    document.getElementById('auth-sub').textContent = isSignUp ? 'Sign up to start tailoring your resume.' : 'Welcome back. Sign in to tailor your resume.';
    document.getElementById('submit-btn').textContent = isSignUp ? 'CREATE ACCOUNT' : 'SIGN IN';
    document.getElementById('toggle').innerHTML = isSignUp
      ? 'Already have an account? <a onclick="toggleMode()">Sign in</a>'
      : 'Don\'t have an account? <a onclick="toggleMode()">Sign up</a>';
    hideMessages();
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg; el.style.display = 'block';
    document.getElementById('success-msg').style.display = 'none';
  }
  function showSuccess(msg) {
    const el = document.getElementById('success-msg');
    el.textContent = msg; el.style.display = 'block';
    document.getElementById('error-msg').style.display = 'none';
  }
  function hideMessages() {
    document.getElementById('error-msg').style.display = 'none';
    document.getElementById('success-msg').style.display = 'none';
  }

  async function googleSignIn() {
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: 'https://resumatch.help/login' }
    });
    if (error) showError(error.message);
  }

  async function handleSubmit(e) {
    e.preventDefault();
    hideMessages();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (isSignUp) {
      const { error } = await sb.auth.signUp({ email, password });
      btn.disabled = false;
      if (error) return showError(error.message);
      showSuccess('Check your email for a confirmation link.');
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      btn.disabled = false;
      if (error) return showError(error.message);
      window.location.href = '/app';
    }
  }
</script>
</body>
</html>
